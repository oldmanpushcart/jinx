# Micronaut 框架核心配置
micronaut:
  application:
    name: jinx
  server:
    # 服务器默认字符集
    charset: UTF-8
    # 服务监听端口
    port: 8080
    # 服务绑定地址 (0.0.0.0 表示监听所有网络接口)
    host: 127.0.0.1
    # 服务器空闲超时时间（针对入站请求，即别人调用你的接口）
    idle-timeout: 60s
    # 服务器连接建立超时时间
    connect-timeout: 5s

# Jinx 应用自定义配置
jinx:

  # 技能配置
  skill:
    directories:
      - ./skills

  # MCP配置
  mcp:
    servers:
      amap:
        # MCP 服务器类型：流式 HTTP
        type: streamable-http
        # 高德地图 MCP 服务基础 URL
        base-url: https://mcp.amap.com
        # MCP 服务端点路径，使用 ${} 占位符引用环境变量作为 API Key
        endpoint: /mcp?key=${AMAP_MAPS_API_KEY}

  # 阿里云灵积（DashScope）平台配置
  dashscope:
    # 客户端配置
    client:
      ak: ${DASHSCOPE_AK}
      http:
        # HTTP 客户端连接超时（针对出站请求，即你调用别人的接口）
        connect-timeout: 5s
        # HTTP 客户端读取超时
        read-timeout: 60s
        # HTTP 客户端写入超时
        write-timeout: 30s
    # 智能体配置
    agent:
      # 数据存储空间目录
      dataspace: ./data
      # 工作空间目录
      workspace: ./
      # 模型名称，仅限于：(qwen-flash | qwen-plus | qwen-max) 三者之一
      model: qwen-flash