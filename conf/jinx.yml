# Jinx 应用自定义配置
jinx:

  # 技能配置
  skill:
    directories:
      - ./skills
    # Skill 配置文件目录（每个 Skill 一个 .skill.json 文件）
    config-directory: ./conf/skills

  # MCP配置
  mcp:
    # MCP 工具配置目录（每个工具一个 .mcp.json 文件）
    config-directory: ./conf/mcp

  # 阿里云灵积（DashScope）平台配置
  dashscope:
    # 客户端配置
    client:
      ak: ${DASHSCOPE_AK}
      http:
        # HTTP 客户端连接超时（针对出站请求，即你调用别人的接口）
        connect-timeout: 5s
        # HTTP 客户端读取超时
        read-timeout: 60s
        # HTTP 客户端写入超时
        write-timeout: 30s
    # 智能体配置
    agent:
      # 数据存储空间目录
      dataspace: ./data
      # 工作空间目录
      workspace: ./
      # 模型名称，仅限于：(qwen-flash | qwen-plus | qwen-max) 三者之一
      model: qwen-flash

  # 语音配置
  speech:
    # 播放器源数据行配置
    speaker:
      enabled: true
      source-data-line:
        sample-rate: 8000
        sample-size-in-bits: 16
        channels: 1
        signed: true
        big-endian: false
    # 录音源数据行配置
    catcher:
      enabled: false
      target-data-line:
        sample-rate: 8000
        sample-size-in-bits: 16
        channels: 1
        signed: true
        big-endian: false
