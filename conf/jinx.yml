# Jinx 应用自定义配置
jinx:

  # 数据空间
  dataspace: ./dataspace

  # 工作空间
  workspace: ${HOME}

  # 阿里云灵积（DashScope）平台配置
  dashscope:
    agent:
      name: Jinx
      description: Jinx Agent
    client:
      ak: ${DASHSCOPE_AK}
      http:
        connect-timeout: 5s
        read-timeout: 60s
        write-timeout: 30s

  # 语音配置
  speech:

    # 播放器配置
    speaker:
      enabled: true
      source-data-line:
        sample-rate: 8000
        sample-size-in-bits: 16
        channels: 1
        signed: true
        big-endian: false

    # 拾音器配置
    catcher:
      enabled: false
      target-data-line:
        sample-rate: 8000
        sample-size-in-bits: 16
        channels: 1
        signed: true
        big-endian: false